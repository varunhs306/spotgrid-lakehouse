[project]
name = "spotgrid-lakehouse"
version = "0.2.0"
description = "Lakehouse for German power-market data"
authors = [
    { name = "varunhs306", email = "varunhs306@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.110",
    "duckdb>=1.5.6,<1.6",
    "httpx>=0.28",
    "pyarrow>=26.0.0",
]

[dependency-groups]
# What the Lambda zip ships; boto3 comes with the Lambda runtime.
api = [
    "fastapi>=0.140",
    "httpx>=0.28",
    "mangum>=0.22",
    "pyarrow>=26.0.0",
]
# What the pipeline container adds to the package.
pipeline = [
    "dbt-core>=1.12.6,<1.13",
    "dbt-duckdb>=1.11.1,<1.12",
]
dev = [
    { include-group = "api" },
    { include-group = "pipeline" },
    "jsonschema>=4.26.0",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
