[project]
name = "spotgrid-lakehouse"
version = "0.0.0"
description = "Lakehouse for German power-market data"
authors = [
    { name = "varunhs306", email = "varunhs306@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.110",
    "databricks-sdk>=0.148.0",
    "databricks-sql-connector>=4.0",
    "httpx>=0.28",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "pyspark>=4.2.0",
    "pytest>=8",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
