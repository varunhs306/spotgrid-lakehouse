version: 2

models:
  - name: grid_quarterhour
    description: >
      One row per grid region and UTC quarter-hour: load, residual load, generation by source,
      pumped storage, forecasts and derived features. A series SMARD does not publish for a
      region is null. Bundesnetzagentur | SMARD.de (CC BY 4.0).
    columns: &grid_columns
      - name: region
        description: DE, AT, LU, a German control area (50Hertz, Amprion, TenneT, TransnetBW), APG or Creos
        data_tests: [not_null]
      - name: ts_utc
        description: Slot start
        data_tests: [not_null]
      - name: local_date
        description: Slot start date in Europe/Berlin
      - name: renewable_mwh
        description: Wind onshore and offshore, solar, hydropower, biomass and other renewables
      - name: renewable_share_pct
        description: renewable_mwh over load_mwh
      - name: net_pumped_storage_mwh
        description: Pumped-storage generation minus pumped-storage consumption
      - name: is_complete
        description: Every actual SMARD publishes for the region is in; forecasts do not count
      - name: updated_at
        description: When spotgrid last changed a value in the row

  - name: grid_hourly
    description: As grid_quarterhour, per UTC hour.
    columns: *grid_columns

  - name: grid_daily
    description: >
      Energy per region and German local day, summed from grid_hourly; shares recomputed from
      the sums. is_complete also needs every hour of the day (23, 24 or 25).

  - name: grid_monthly
    description: As grid_daily, per German local month.

  - name: prices_quarterhour
    description: >
      Day-ahead price per bidding zone and UTC quarter-hour, with the spread to DE-LU. Before
      2025-10-01 SMARD's quarter-hours repeat the hourly price; source_resolution says so.
    columns: &price_columns
      - name: zone
        description: Bidding zone; DE-LU includes DE-AT-LU until 2018-09-30
        data_tests: [not_null]
      - name: ts_utc
        data_tests: [not_null]
      - name: source_zone
        description: Zone that cleared the price
      - name: spread_to_de_lu_eur_mwh
        description: Price minus the DE-LU price of the same slot

  - name: prices_hourly
    description: As prices_quarterhour, per UTC hour.
    columns: *price_columns

  - name: prices_daily
    description: >
      Base, peak (08:00-20:00 local, Monday to Friday) and off-peak price, range and negative
      hours per zone and German local day, from prices_hourly.

  - name: prices_monthly
    description: As prices_daily, per German local month.

  - name: revisions
    description: Every change SMARD made to a published value, from the revisions log.

  - name: revision_stats
    description: How often, how late and by how much SMARD revises each series and area.

  - name: coverage
    description: First and last slot and last change per series, area and resolution.
