version: 2

models:
  - name: hourly_features
    description: >
      One row per UTC hour: day-ahead price, load, wind and solar actuals and forecasts, and
      residual load. Bundesnetzagentur | SMARD.de (CC BY 4.0).
    columns:
      - name: ts_utc
        description: Hour start
        data_tests: [unique, not_null]
      - name: local_date
        description: Hour start date in Europe/Berlin
        data_tests: [not_null]
      - name: price_zone
        description: Bidding zone of the price, DE-AT-LU until 2018-09-30, DE-LU after
        data_tests:
          - accepted_values:
              arguments:
                values: ["DE-LU", "DE-AT-LU"]
      - name: price_eur_mwh
        description: Day-ahead price in price_zone
      - name: load_mwh
        description: Grid load
      - name: residual_load_mwh
        description: Load minus wind and solar generation; null until all four are published
      - name: source_resolution
        description: Resolution of the silver rows this hour was built from
        data_tests:
          - accepted_values:
              arguments:
                values: ["hour"]

  - name: quarterhour_features
    description: >
      One row per UTC quarter-hour since 2025-10-01, the first day of 15-minute day-ahead
      prices. Volumes are MWh per quarter-hour. Bundesnetzagentur | SMARD.de (CC BY 4.0).
    columns:
      - name: ts_utc
        description: Quarter-hour start
        data_tests: [unique, not_null]
      - name: local_date
        description: Quarter-hour start date in Europe/Berlin
        data_tests: [not_null]
      - name: price_eur_mwh
        description: Day-ahead price, bidding zone DE-LU

  - name: daily_price_summary
    description: Day-ahead price statistics per German local day.
    columns:
      - name: local_date
        data_tests: [unique, not_null]
      - name: negative_price_hours
        description: Hours with a price below zero
      - name: price_hours
        description: Hours with a published price; 23 or 25 on daylight-saving days

  - name: revision_stats
    description: >
      How often, how late and by how much SMARD revised each series since landing began.
      Changes are in the series' unit, EUR/MWh for prices and MWh per slot for volumes.
    columns:
      - name: series_id
        data_tests: [not_null]
      - name: slots
        description: Slots in silver
      - name: revisions
        description: Changes to published values; a slot can change more than once
      - name: revised_slots_pct
        description: Share of slots changed at least once, in percent
      - name: median_delay_days
        description: Median days from slot start to the landing that carried the change
      - name: median_change_pct
        description: Median change relative to the old value, in percent
      - name: observed_since
        description: First landing; earlier revisions were never seen
