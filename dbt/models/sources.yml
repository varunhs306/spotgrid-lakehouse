version: 2

sources:
  - name: silver
    database: workspace
    schema: silver
    tables:
      - name: smard_timeseries
        description: >
          SMARD series at native resolution, one row per series, region, resolution and slot.
          Built by the silver_smard job. Bundesnetzagentur | SMARD.de (CC BY 4.0).
        # The morning run always lands yesterday's actuals, so a value changes every day.
        config:
          loaded_at_field: last_changed_at
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
        columns:
          - name: series_id
            data_tests: [not_null]
          - name: ts_utc
            data_tests: [not_null]
          - name: value
            data_tests: [not_null]
      - name: revisions
        description: One row per change SMARD made to a published value. Built by the silver_smard job.
        columns:
          - name: ts_utc
            data_tests: [not_null]
          - name: detected_at
            data_tests: [not_null]
