spotgrid:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('WAREHOUSE', 'warehouse.duckdb') }}"
      schema: gold
      threads: 1
      settings:
        TimeZone: UTC
        preserve_insertion_order: false
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '1.5GB') }}"
