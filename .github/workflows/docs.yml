name: docs

# dbt docs for the gold and silver tables, at /dbt/ on GitHub Pages. Rebuilt when the dbt
# project changes on main. Column types come from the model YAML, not a warehouse.
on:
  push:
    branches: [main]
    paths: ["dbt/**", "src/spotgrid_lakehouse/sources/catalog.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --no-dev --group pipeline
      - name: generate
        timeout-minutes: 10
        env:
          WAREHOUSE: ${{ runner.temp }}/docs.duckdb
        run: |
          uv run --no-dev python -m spotgrid_lakehouse.gold docs generate --static --empty-catalog
          mkdir -p site/dbt
          cp dbt/target/static_index.html site/dbt/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dbt/
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
