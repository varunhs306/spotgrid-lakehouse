bundle:
  name: spotgrid-lakehouse

# Code ships in the wheel; only job entrypoints are synced to the workspace.
sync:
  paths:
    - jobs

artifacts:
  wheel:
    type: whl
    build: uv build --wheel
    path: .
    # Serverless caches environments by wheel name; a fresh version per deploy avoids stale code.
    dynamic_version: true

resources:
  jobs:
    # Once, by hand: --python-params --revisions-from-bronze logs the revisions bronze holds.
    silver_smard:
      name: silver_smard
      tasks:
        - task_key: merge
          environment_key: default
          spark_python_task:
            python_file: jobs/silver_smard.py
            parameters: ["--lookback-days", "3"]
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl
    # Run by hand: replays all of bronze into a side table and fails if it disagrees with silver.
    silver_rebuild:
      name: silver_rebuild
      tasks:
        - task_key: rebuild
          environment_key: default
          spark_python_task:
            python_file: jobs/silver_smard.py
            parameters:
              - --rebuild
              - --table
              - workspace.silver.smard_timeseries_rebuild
              - --compare-with
              - workspace.silver.smard_timeseries
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl

targets:
  dev:
    mode: development
    default: true
  # Deployed and run by the daily workflow as the pipeline's service principal.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
